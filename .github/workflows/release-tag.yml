name: Release tag

# Tags each released plugin version on main as <plugin>--v<version>, the
# same name `claude plugin tag` uses. A push whose version already has a tag
# does nothing, so only a merge that raised the version creates one.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag each plugin version that is new
        run: |
          git fetch --tags --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          for manifest in builds/local-plugin/agent-smith/.claude-plugin/plugin.json construct/.claude-plugin/plugin.json; do
            [ -f "${manifest}" ] || continue
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            tag="${name}--v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists."
              continue
            fi
            git tag -a "${tag}" -m "${name} ${version}"
            git push origin "refs/tags/${tag}"
            echo "Created ${tag}."
          done
