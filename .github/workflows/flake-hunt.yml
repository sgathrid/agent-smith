name: Flake hunt

# Runs the suite several times at once on a CPU-loaded runner. A test that
# passes here does not depend on timing; one that fails is a flake to fix,
# not to retry. Nightly and on demand, so it never blocks a PR.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Concurrent suite runs
        default: '4'

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUNS: ${{ inputs.runs || '4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: |
            package-lock.json
            the-codes/surfaces/channel/package-lock.json
      - run: npm ci
      - run: npm --prefix the-codes/surfaces/channel ci
      - name: Suite x RUNS under CPU load
        run: |
          load_pids=()
          for i in 1 2; do yes > /dev/null & load_pids+=($!); done
          trap 'kill "${load_pids[@]}" 2>/dev/null || true' EXIT
          pids=()
          for i in $(seq "$RUNS"); do npm test > "run-$i.log" 2>&1 & pids+=($!); done
          status=0
          for i in "${!pids[@]}"; do
            run=$((i + 1))
            if wait "${pids[$i]}"; then
              echo "Suite $run passed (exit 0)."
            else
              code=$?
              status=1
              echo "::group::Suite $run failed (exit $code)"
              cat "run-$run.log"
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-logs-${{ matrix.os }}
          path: run-*.log
          retention-days: 14
