name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Both supported platforms, the minimum Node and the current LTS. The macOS
    # leg runs far from UTC so a test that assumes the runner's timezone fails
    # here rather than on someone's laptop.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18', 'lts/*']
        include:
          - os: macos-latest
            tz: Pacific/Auckland
    runs-on: ${{ matrix.os }}
    env:
      TZ: ${{ matrix.tz || 'UTC' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            the-codes/surfaces/channel/package-lock.json
      - run: npm ci
      - run: npm --prefix the-codes/surfaces/channel ci
      - run: npm run typecheck
      - run: npm --prefix the-codes/surfaces/channel run typecheck
      - run: npm test

  plugin-build-fresh:
    # The committed builds/local-plugin is what marketplace users install.
    # Rebuild it and fail if it differs from the source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            the-codes/surfaces/channel/package-lock.json
      - run: npm ci
      - run: npm --prefix the-codes/surfaces/channel ci
      - run: npm run build:plugin
      - name: Committed plugin build matches source
        run: |
          git add -N builds/
          if ! git diff --exit-code --stat builds/; then
            echo "::error::builds/local-plugin is stale. Run 'npm run build:plugin' and commit the result."
            exit 1
          fi

  plugin-version-bumped:
    # Installed copies are keyed by version: a changed build under an unchanged
    # version never reaches users, and `claude plugin update` says they're current.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Plugin version rises when the build changes
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/check-version.mjs "$BASE"
